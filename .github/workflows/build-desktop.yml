name: Desktop builds

# The two platforms nobody here can build. Development happens on a Mac,
# so Linux and Windows are the ones that break unnoticed — a plugin
# without an implementation, a missing system library, a CMake runner that
# has fallen behind the Flutter template.
#
# The artefacts are kept because they are also the only way to get a build
# of either onto a machine that can actually run it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Xapian shim for Windows, cross-built here rather than on the
  # Windows runner: xapian-core 1.4 ships no MSVC project files any more,
  # while its configure handles mingw deliberately. One toolchain to keep
  # instead of two, and the Windows job only has to pick the file up.
  xapian-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Only what the compile needs, not the finished library: relinking
      # the shim takes seconds, building xapian-core takes ten minutes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            preppsuite_flutter/native/zim_xapian/build/vendor
            preppsuite_flutter/native/zim_xapian/build/xapian-windows-x64
          key: xapian-windows-${{ hashFiles('preppsuite_flutter/native/zim_xapian/xapian_source.sh') }}

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 libz-mingw-w64-dev

      - name: Build
        run: preppsuite_flutter/native/zim_xapian/build_windows.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zim-xapian-windows
          path: preppsuite_flutter/native/zim_xapian/build/zim_xapian.dll

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'

      # Beyond the usual Flutter toolchain: webkit2gtk and libsoup are what
      # desktop_webview_window draws articles with, and their absence is a
      # link error rather than a warning.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            zlib1g-dev uuid-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libsecret-1-dev

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            preppsuite_flutter/native/zim_xapian/build/vendor
            preppsuite_flutter/native/zim_xapian/build/xapian-linux-x86_64
          key: xapian-linux-${{ hashFiles('preppsuite_flutter/native/zim_xapian/xapian_source.sh') }}

      # Before the app, because CMake only bundles the library if it is
      # already there — and skipping it silently costs the full-text
      # search, which is the sort of thing nobody notices in an artefact.
      - name: Build Xapian shim
        run: preppsuite_flutter/native/zim_xapian/build_linux.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        working-directory: preppsuite_flutter
        run: flutter build linux --release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preppsuite-linux-x64
          path: preppsuite_flutter/build/linux/x64/release/bundle

  windows:
    runs-on: windows-latest
    needs: xapian-windows

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zim-xapian-windows
          path: preppsuite_flutter/native/zim_xapian/build

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        working-directory: preppsuite_flutter
        run: flutter build windows --release

      # The packages shipped for months needing the Microsoft C++ runtime
      # and not carrying it. On a build machine that is invisible -- the
      # runtime is always there -- and on a user's machine the app did not
      # crash but hung with no window and no message. windows/CMakeLists.txt
      # bundles it now; this is what stops that being undone quietly.
      - name: Die C++-Laufzeit muss im Paket liegen
        shell: pwsh
        working-directory: preppsuite_flutter/build/windows/x64/runner/Release
        run: |
          $needed = 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll'
          $missing = $needed | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "::error::Im Paket fehlt: $($missing -join ', ')"
            Write-Host "Ohne diese Dateien startet die App auf einem Rechner ohne Visual C++ Redistributable gar nicht, und zwar lautlos."
            Write-Host "Vorhanden sind:"
            Get-ChildItem *.dll | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }
          Write-Host "Laufzeit im Paket: $($needed -join ', ')"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preppsuite-windows-x64
          path: preppsuite_flutter/build/windows/x64/runner/Release
