name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One job now. There is no server to start containers for and no generated
# client to check for staleness — the app is the whole project.
jobs:
  app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        working-directory: preppsuite_flutter
        run: flutter test
