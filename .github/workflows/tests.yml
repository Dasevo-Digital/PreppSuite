name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One job now. There is no server to start containers for and no generated
# client to check for staleness — the app is the whole project.
permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        working-directory: preppsuite_flutter
        run: flutter test
