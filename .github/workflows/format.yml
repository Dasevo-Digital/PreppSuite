name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Install dependencies
        run: flutter pub get

      # Generated code included: drift's generator emits dart-format-clean
      # output, so a diff here means a hand edit that needs reformatting.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
