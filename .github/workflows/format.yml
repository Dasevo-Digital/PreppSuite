name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'

      - name: Install dependencies
        run: flutter pub get

      # Checked across the whole workspace, generated code included —
      # the Serverpod and drift generators both emit dart-format-clean
      # output, so a diff here means a hand edit that needs reformatting.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
