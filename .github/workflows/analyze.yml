name: Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check repository privacy
        run: tool/repo_privacy_check.sh

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'

      - name: Install dependencies
        run: flutter pub get

      # `flutter analyze` treats info- and warning-level issues as fatal by
      # default, which is what keeps lint noise from accumulating.
      - name: Analyze
        run: flutter analyze
