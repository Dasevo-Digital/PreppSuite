name: Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check repository privacy
        run: tool/repo_privacy_check.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Install dependencies
        run: flutter pub get

      # `flutter analyze` treats info- and warning-level issues as fatal by
      # default, which is what keeps lint noise from accumulating.
      - name: Analyze
        run: flutter analyze
