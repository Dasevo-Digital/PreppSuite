name: Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'

      - name: Install dependencies
        run: flutter pub get

      # Run from the workspace root so all three packages are covered
      # (server, generated client, app) — each still picks up its own
      # analysis_options.yaml. `flutter analyze` treats info- and
      # warning-level issues as fatal by default, matching the
      # `dart analyze --fatal-infos` this used to run on the server alone.
      - name: Analyze
        run: flutter analyze
