name: preppsuite_flutter
description: A new Flutter project with Serverpod.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 0.14.0+11

environment:
  sdk: '^3.8.0'
  flutter: '^3.32.0'

resolution: workspace

dependencies:
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  mobile_scanner: ^7.4.0
  openfoodfacts: ^3.30.2
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.5.5
  csv: ^8.0.0
  # Pinned below 9.x: file_picker 12.0.0 (via file_picker_darwin 1.0.0)
  # calls macOS-native methods by FileType name (e.g. "custom"), but the
  # native macOS handler only implements the older "pickFiles"-style API —
  # every pick fails with MissingPluginException on this platform. 8.x's
  # macOS implementation uses "pickFiles" and works correctly.
  file_picker: ^8.3.7
  image_picker: ^1.2.3
  # Cropping and rotating a product photo (see `photo_edit.dart`).
  # `printing` pulls it in too, but a transitive dependency cannot be
  # imported.
  image: ^4.8.0
  path: ^1.9.1
  flutter_local_notifications: ^22.3.0
  geolocator: ^14.0.2
  http: ^1.6.0
  # Parses MeteoAlarm's Atom+CAP feed, which the app now fetches itself
  # instead of going through a server.
  xml: ^6.6.1
  # Periodic background polling for warnings. Android runs it through
  # WorkManager (15-minute floor, a platform limit); on iOS it maps to
  # BGAppRefreshTask, which the system schedules when it feels like it.
  workmanager: ^0.10.9
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  vector_map_tiles: ^9.0.0-beta.13
  vector_tile_renderer: ^6.1.0
  zstandard: ^1.5.0
  archive: ^4.0.0
  # Renders the HTML that comes out of a ZIM archive. The pages are real
  # Wikipedia, stylesheets and all; anything less than a browser engine
  # would show them badly.
  #
  # It reaches Android, iOS and macOS. Linux and Windows have no
  # implementation at all, which is why the second package is here.
  webview_flutter: ^4.14.1
  # The article view on Linux and Windows, where it opens a window of its
  # own rather than a panel. Uses the engine the system already has —
  # WebKitGTK and WebView2 — rather than bundling Chromium, which is what
  # the embedded alternative (webview_cef) costs: a few hundred megabytes
  # per platform, against an app whose whole desktop build is seventy.
  desktop_webview_window: ^0.3.0
  # The FFI binding to the Xapian shim in native/zim_xapian, which
  # searches the full-text index a ZIM archive carries inside it.
  ffi: ^2.1.4
  # Needed directly for scheduling expiry reminders; flutter_local_notifications
  # pulls it in too, but a transitive dependency cannot be imported.
  timezone: ^0.11.0
  cryptography: ^2.9.0

dev_dependencies:
  build_runner: ^2.15.1
  # Runs a test inside the real app on a real device, which is the only
  # place the Kotlin and Swift storage bridges exist at all. The unit
  # suite mocks that channel; nothing else checks there is something on
  # the other end of it.
  integration_test:
    sdk: flutter
  drift_dev: ^2.34.0
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  assets:
    - assets/config.json
    - assets/fonts/NotoSans-Regular.ttf
dependency_overrides:
  flutter_secure_storage: ^10.0.0

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
