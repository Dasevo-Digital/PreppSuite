name: preppsuite_flutter
description: Local household preparedness, inventory and offline reference tools.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 2.4.6+246

environment:
  sdk: '^3.8.0'
  flutter: '^3.32.0'

resolution: workspace

# Flutter resolves the executable's native assets from this package.  The
# workspace root carries the same configuration for command-line tooling.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^10.2.2
  intl: any
  flutter_riverpod: ^3.4.2
  drift: ^2.35.0
  # Named directly only so that core/error_text.dart can recognise a
  # raw SqliteException. Drift wraps most database errors, but not the
  # ones thrown while the database is being opened -- which is exactly
  # when a failure is least explainable to the person looking at it.
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  uuid: ^4.6.0
  mobile_scanner: ^7.4.2
  # QR codes are generated from this pure-Dart encoder and painted by
  # the app itself (features/transfer/presentation/qr_code_view.dart).
  # qr_flutter would have saved the painter and has not been published
  # in three years; the painter is sixty lines and the module data is
  # all that is really needed.
  qr: ^3.0.2
  openfoodfacts: ^3.30.2
  pdf: ^3.13.1
  # Pure-Dart PDF parser used for the offline full-text index of personal
  # documents. Unlike a platform PDF viewer, it works on mobile and desktop
  # without sending a document to a service.
  #
  # 7.0.0 with pdfrx 2.6 (#95); 6.0.0 since 2.3.9 (#78). The parts used
  # here -- opening a document and reading its text -- did not change, and
  # the personal document tests run against generated PDFs on every check.
  pdf_document: 7.0.0
  pdf_graphics: 7.0.0
  # Local renderer for PDFs from the personal knowledge library.  It uses
  # PDFium on every supported native platform, so a document never has to
  # leave the device merely to be read.
  #
  # Pinned exactly, as before: this brings PDFium in, and PDFium is what
  # takes apart files nobody in this project wrote.
  #
  # 2.4.8 rather than 2.2.24 for two reasons.  It carries PDFium
  # chromium/7811 instead of chromium/7520 -- some three hundred revisions
  # of fixes in the one component that parses untrusted input.  And it
  # declares its web assets as `platforms: [web]`, so the 4 MB pdfium.wasm
  # stops riding along in the macOS, Linux, Windows and Android packages,
  # where nothing can execute it.
  #
  # 2.6.5 since Flutter 3.47 / Dart 3.13 (#95), which it needs; sqlite3 3.7
  # moved with it. The PDFium inside is still chromium/7811, so
  # tool/pdfium_provenance.txt did not change.
  pdfrx: 2.6.5
  printing: ^5.14.3
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^10.3.4
  # Reads the first aid steps out loud, for the one situation where both
  # hands are busy. No Linux implementation exists -- see
  # core/speech_capabilities.dart, which is what keeps the button off that
  # platform rather than letting it throw.
  flutter_tts: ^4.2.5
  # Direct, because a carried copy registers a settings store of its own
  # that writes into the folder on the disk rather than into the
  # platform's place. See lib/core/portable_preferences.dart.
  shared_preferences_platform_interface: ^2.4.1
  csv: ^8.0.0
  # 13 since #93. 12.0 broke every pick on macOS (MissingPluginException,
  # fixed in file_picker_darwin 1.0.1). Since 12 the save dialog writes the
  # bytes itself on every platform and answers a Uri; a backup too large
  # to hand over is saved as an empty file and streamed into it.
  file_picker: ^13.1.0
  # Only so a backup can be handed to the system's share sheet. The file
  # picker cannot reach OneDrive or Google Drive on Android -- neither
  # registers a document tree -- but both are ordinary share targets, so
  # this is what makes a cloud a usable transport for the one file the
  # household may not lose.
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  # Cropping and rotating a product photo (see `photo_edit.dart`).
  # `printing` pulls it in too, but a transitive dependency cannot be
  # imported.
  image: ^4.10.1
  path: ^1.9.1
  flutter_local_notifications: ^22.3.1
  geolocator: ^14.1.1
  http: ^1.6.0
  # Parses MeteoAlarm's Atom+CAP feed, which the app now fetches itself
  # instead of going through a server.
  xml: ^7.1.0
  # The Dart team's own HTML parser. Direct, because the built-in article
  # reader turns a ZIM article into widgets without a browser engine —
  # parsing is the part worth taking from somewhere that maintains it,
  # the drawing is this app's own. See
  # lib/features/knowledge/application/article_document.dart.
  html: ^0.15.6
  # Periodic background polling for warnings. Android runs it through
  # WorkManager (15-minute floor, a platform limit); on iOS it maps to
  # BGAppRefreshTask, which the system schedules when it feels like it.
  workmanager: ^0.10.9
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  vector_map_tiles: ^9.0.0-beta.13
  vector_tile_renderer: ^6.1.0
  # Direct, because the offline "what is nearby" search reads the `poi`
  # layer out of the same tiles the map draws from, and the renderer
  # re-exports only `VectorTile` — not the layer and geometry types that
  # needs. Held at 2.x: that is what the renderer itself resolves, and two
  # copies of a protobuf model in one app is not a thing.
  vector_tile: ^2.0.1
  zstandard: ^1.5.0
  # Direct, because the app decompresses through the streaming API itself
  # rather than the plugin's size-guessing `decompress`; see
  # lib/features/knowledge/application/zstd_stream.dart.
  zstandard_native: ^1.5.0
  archive: ^4.0.0
  # Renders the HTML that comes out of a ZIM archive. The pages are real
  # Wikipedia, stylesheets and all; anything less than a browser engine
  # would show them badly.
  #
  # It reaches Android, iOS and macOS. Linux and Windows have no
  # implementation at all, which is why the second package is here.
  webview_flutter: ^4.14.1
  # The article view on Linux and Windows, where it opens a window of its
  # own rather than a panel. Uses the engine the system already has —
  # WebKitGTK and WebView2 — rather than bundling Chromium, which is what
  # the embedded alternative (webview_cef) costs: a few hundred megabytes
  # per platform, against an app whose whole desktop build is seventy.
  desktop_webview_window: ^0.3.0
  # The FFI binding to the Xapian shim in native/zim_xapian, which
  # searches the full-text index a ZIM archive carries inside it.
  ffi: ^2.1.4
  # Needed directly for scheduling expiry reminders; flutter_local_notifications
  # pulls it in too, but a transitive dependency cannot be imported.
  timezone: ^0.11.0
  cryptography: ^2.9.0
  # The beat for chest compressions. A metronome is the one thing this
  # app can do during a resuscitation that a printed card cannot, so it
  # has to make a sound that is actually audible -- Flutter's own
  # SystemSound.click follows the system's "touch sounds" setting, which
  # is off on most phones, and would be a metronome that is silent
  # exactly when it is needed.
  #
  # On Linux this reaches the sound card through GStreamer, which a
  # desktop usually already has; where it is missing the pacer keeps its
  # flashing and its vibration and says the tone is unavailable. See
  # features/first_aid/presentation/compression_pacer_sheet.dart.
  audioplayers: ^6.5.0
  # Plays a clip out of a downloaded first aid video pack. Reaches
  # Android, iOS and macOS; on Linux and Windows there is no
  # implementation, and the file is handed to the system's own player
  # through url_launcher instead -- the same split the article reader
  # makes, for the same reason.
  video_player: ^2.10.0
  # Keeps the screen on while the compression pacer runs. Without it the
  # display sleeps after half a minute -- in the middle of a
  # resuscitation, taking the count and the beat with it, because a
  # backgrounded app's timers are throttled by every platform here.
  # 1.8.0 and not 1.8.1: 1.8.1 needs dbus 0.8, geolocator_linux still 0.7.
  wakelock_plus: ^1.8.0
  url_launcher: ^6.3.2
  home_widget: ^0.10.0
  # Long-press actions on the app icon (#123): 112, a sign of life, first
  # aid and the emergency cards, without opening the app first.
  quick_actions: ^1.1.0

dev_dependencies:
  # Only so the geolocation test can stand in for the platform and
  # prove the last-known-position fallback. Both arrive transitively
  # through `geolocator`; naming them here is what lets a test import
  # them without the analyzer objecting.
  geolocator_platform_interface: ^4.2.0
  plugin_platform_interface: ^2.1.0
  build_runner: ^2.15.1
  # Runs a test inside the real app on a real device, which is the only
  # place the Kotlin and Swift storage bridges exist at all. The unit
  # suite mocks that channel; nothing else checks there is something on
  # the other end of it.
  integration_test:
    sdk: flutter
  drift_dev: ^2.34.0
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  assets:
    - assets/dwd_warncells.csv
    - assets/sounds/metronome_click.wav
    - assets/fonts/NotoSans-Regular.ttf
    # The drawings of the children's comic, rendered from
    # tool/comic/mila_und_nuss.html by tool/comic/render_panels.py.
    - assets/comic/
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
