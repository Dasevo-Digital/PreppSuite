name: preppsuite_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

resolution: workspace

dependencies:
  # Signs the service-account JWT and refreshes the access token for FCM's
  # HTTP v1 API. Already in the tree via serverpod's GCP support; declared
  # here because a transitive dependency cannot be imported.
  googleapis_auth: ^2.3.3
  http: ^1.6.0
  serverpod: 3.4.11
  serverpod_auth_core_server: 3.4.11
  serverpod_auth_idp_server: 3.4.11
  xml: ^6.6.1

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.11
  test: ^1.25.5
  uuid: ^4.5.3

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\preppsuite_flutter
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web ..\preppsuite_server\web\app
      posix: |
        cd ../preppsuite_flutter
        flutter build web --base-href /app/ --wasm --output ../preppsuite_server/web/app
