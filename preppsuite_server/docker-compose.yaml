services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: preppsuite
      POSTGRES_PASSWORD: "icTGQwuQD72rItA56ZJlgGuDQVzYY3vq"
    volumes:
      - preppsuite_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "bs8QCB2sFYiDILekwoR1BvbdelYlzbfu"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: preppsuite_test
      POSTGRES_PASSWORD: "APi6TY2eFHvcAOXuSpE-8osYa3Hl_CTN"
    volumes:
      - preppsuite_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "SIpV-DDEuPOYHJRNKdw-yR5hmbDu-GON"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  preppsuite_data:
  preppsuite_test_data:
