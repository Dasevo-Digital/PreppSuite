### Which push service a device is reachable through.
###
### Both go out via FCM: Firebase relays iOS messages to APNs using the
### APNs key uploaded to the Firebase project, so the server has one
### sending path rather than two. The distinction is still needed because
### the two platforms take a differently shaped payload (Android reads
### `notification` directly, APNs needs its own `aps` block for the
### message to be displayed while the app is closed).
enum: PushPlatform
serialized: byName
values:
  - android
  - ios
