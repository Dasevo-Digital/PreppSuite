### The reason a household operation was rejected.
enum: HouseholdExceptionReason
serialized: byName
values:
  ### The provided invite code does not match any household.
  - invalidInviteCode
  ### The caller is not a member of the household they are trying to access.
  - notAMember
  ### The operation requires the "owner" role.
  - notOwner
  ### A user may only belong to a single household at a time; the caller
  ### already has a membership.
  - alreadyInHousehold
