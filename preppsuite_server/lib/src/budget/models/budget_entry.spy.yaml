### A single budget/spending entry for a household, optionally linked to an
### inventory item it paid for.
class: BudgetEntry
table: budget_entry
fields:
  id: UuidValue?, defaultPersist=random_v7
  clientId: UuidValue

  household: Household?, relation(onDelete=Cascade)

  label: String

  ### Stored as integer cents to avoid floating-point money.
  amountCents: int

  ### ISO 4217 currency code.
  currency: String

  category: InventoryItemCategory
  purchaseDate: DateTime?
  linkedInventoryItemId: UuidValue?

  updatedAt: DateTime, defaultModel=now
  deletedAt: DateTime?

indexes:
  budget_entry_household_client_id:
    fields: householdId, clientId
    unique: true
  budget_entry_household_updated_at:
    fields: householdId, updatedAt
