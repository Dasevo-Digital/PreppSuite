name: _
publish_to: none

environment:
  sdk: '^3.13.0'

workspace:
  - preppsuite_flutter

# The local databases contain household and emergency data.  sqlite3.dart
# fetches the matching, signed SQLite3MultipleCiphers asset for every native
# release target through its build hook.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

# flutter_tts 4.2.5 laesst die Windows-App nicht starten: der Konstruktor des
# Plugins aktiviert SpeechSynthesizer und MediaPlayer und wirft dabei aus
# RegisterPlugins heraus, wo nichts faengt -- der Prozess endet vor dem
# Fenster, ohne Meldung und ohne Absturzbericht. Gemessen: derselbe Baum ohne
# das Plugin startete, mit ihm nicht. Eine neuere Fassung gibt es nicht.
#
# third_party/flutter_tts ist 4.2.5 mit genau diesem Fehler behoben; die
# Aenderungen stehen unter "PreppSuite patch" im Quelltext. Beim Nachziehen
# auf eine neue Fassung gehoeren sie erneut angebracht oder -- falls upstream
# sie uebernimmt -- diese Ueberschreibung entfernt.
dependency_overrides:
  flutter_tts:
    path: third_party/flutter_tts
  # zstandard_ios und zstandard_macos 1.5.0 loeschen am Ende jedes Builds
  # die zstd-Quellen, die sie zu Beginn hineinkopieren. Der naechste
  # inkrementelle Build findet sie nicht und scheitert -- genau jeder
  # zweite. Die Kopien unter third_party/ lassen die Quellen liegen; sonst
  # unveraendert. Siehe third_party/LIESMICH.md.
  # mobile_scanner 7.4.2 liest Strichcodes unter Android mit ML Kit, und
  # ML Kit meldet bei jeder Nutzung Geraet, App, eine Installationskennung
  # und Nutzungsereignisse an Google -- abschalten laesst sich das nicht.
  # Die Kopie liest unter Android mit zxing-cpp; iOS und macOS (Apple
  # Vision) sind unveraendert. Siehe third_party/LIESMICH.md.
  mobile_scanner:
    path: third_party/mobile_scanner
  # shared_preferences_android 2.5 (mit 2.6.0 gekommen) meldet seine
  # native Seite in einer prozessweiten Tabelle unter einem einzigen Namen
  # an, und jede Engine, die endet, loescht diesen Eintrag -- auch den, den
  # inzwischen eine andere eingetragen hat. Der Hintergrundabruf der
  # Warnungen ist eine zweite Engine im selben Prozess. Endete er, waehrend
  # die App gerade startete, fand die Oberflaeche keine Einstellungen mehr:
  # "Der Haushalt laesst sich gerade nicht laden", bis der Prozess neu
  # startete (#210). 2.4.28 ist die Fassung bis 2.5.8, mit Kanaelen je
  # Engine. Erst wieder anheben, wenn onDetachedFromEngine nur noch den
  # eigenen Eintrag entfernt; tool/android_release.sh prueft das Paket.
  shared_preferences_android: 2.4.28
  zstandard_ios:
    path: third_party/zstandard_ios
  zstandard_macos:
    path: third_party/zstandard_macos
